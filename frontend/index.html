<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多多益善</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 登入 / 註冊視圖（未登入時顯示，蓋住整個畫面）-->
  <div id="auth-screen" style="display:none">
    <div class="auth-overlay">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-icon">益</div>
          <span class="logo-text">多多益善</span>
        </div>

        <!-- 登入表單 -->
        <div id="login-form">
          <h2 class="auth-title">歡迎回來</h2>
          <p class="auth-subtitle">登入你的帳號繼續練習</p>
          <div class="auth-field">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="your@email.com">
          </div>
          <div class="auth-field">
            <label>密碼</label>
            <input type="password" id="login-password" placeholder="輸入密碼">
          </div>
          <p class="auth-error" id="login-error"></p>
          <button class="btn-primary auth-btn" id="login-btn" onclick="handleLogin()">登入</button>
          <p class="auth-switch">還沒有帳號？
            <a onclick="toggleAuthForm('register')">立即註冊</a>
          </p>
        </div>

        <div id="register-form" style="display:none">
          <h2 class="auth-title">建立帳號</h2>
          <p class="auth-subtitle">加入多多益善，開始你的多益備考</p>
          <div class="auth-field">
            <label>使用者名稱</label>
            <input type="text" id="register-username" placeholder="輸入您的名稱">
          </div>
          <div class="auth-field">
            <label>Email</label>
            <input type="email" id="register-email" placeholder="your@email.com">
          </div>
          <div class="auth-field">
            <label>密碼</label>
            <input type="password" id="register-password" placeholder="至少 6 個字元">
          </div>
          <p class="auth-error" id="register-error"></p>
          <button class="btn-primary auth-btn" id="register-btn" onclick="handleRegister()">註冊</button>
          <p class="auth-switch">已有帳號？
            <a onclick="toggleAuthForm('login')">返回登入</a>
          </p>
        </div>

      </div>
    </div>
  </div>

  <!-- Vue 掛載點：整個 App 都在這個 div 裡面 -->
  <div id="app"></div>

  <!-- Vue 3 CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 你自己的 auth 邏輯 -->
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
